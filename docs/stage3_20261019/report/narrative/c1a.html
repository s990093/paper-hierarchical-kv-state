<p>C1a 是選擇性還原的閘門：第 2 輪答案所在的 block，能不能事先猜中？</p>
<ul>
<li>寫入時就算好的重要性分數只比隨機好 11–24 個百分點（recall@16）；第 1 輪的問題也差不多。</li>
<li>等第 2 輪問題來了，用便宜的 block 摘要（Quest）挑，好 35–45 個百分點；用完整 K 挑（上界）好 61–68 個百分點。</li>
<li>照事先條件，閘門通過（G2、G4 都不觸發），C1b 照計畫做。</li>
</ul>
<p>對使用者問題①的意思：「哪些 token 重要」在寫入時只猜得到一部分，要等下一輪問題來了才準。所以重要性比較適合用在<b>還原時挑要搬哪些</b>，不適合<b>事先丟掉</b>。</p>
