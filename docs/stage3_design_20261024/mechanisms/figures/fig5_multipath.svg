<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<defs>
<marker id="an" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F4E79"/></marker>
<marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#E07B24"/></marker>
</defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="480" y="30" font-size="18" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 5　M06：借鄰卡的 PCIe 一起搬，再經 NVLink 轉給目標卡</text>
<text x="480" y="52" font-size="12.5" fill="#5F5E5A" text-anchor="middle">拓撲是示意：H200 節點上兩張卡是否共用一個 PCIe switch 的上行，NOT_MEASURED（閘 G-M06 第 1 步：nvidia-smi topo -m）</text>

<!-- CPUs -->
<rect x="110" y="76" width="320" height="76" rx="8" fill="#F7F7F5" stroke="#A6A6A6"/>
<text x="126" y="98" font-size="13" font-weight="600" fill="#2C2C2A">CPU 0（EPYC 9554）＋DRAM</text>
<rect x="126" y="110" width="80" height="28" fill="#1F4E79"/><text x="166" y="129" font-size="11.5" fill="#ffffff" text-anchor="middle">KV 片 0</text>
<rect x="214" y="110" width="80" height="28" fill="#1F4E79"/><text x="254" y="129" font-size="11.5" fill="#ffffff" text-anchor="middle">KV 片 1</text>
<rect x="530" y="76" width="320" height="76" rx="8" fill="#F7F7F5" stroke="#A6A6A6"/>
<text x="546" y="98" font-size="13" font-weight="600" fill="#2C2C2A">CPU 1（EPYC 9554）＋DRAM</text>
<rect x="546" y="110" width="80" height="28" fill="#E07B24"/><text x="586" y="129" font-size="11.5" fill="#ffffff" text-anchor="middle">KV 片 2</text>
<rect x="634" y="110" width="80" height="28" fill="#E07B24"/><text x="674" y="129" font-size="11.5" fill="#ffffff" text-anchor="middle">KV 片 3</text>

<!-- switches -->
<rect x="170" y="196" width="200" height="34" rx="6" fill="#DAE3F3" stroke="#8FAADC"/><text x="270" y="218" font-size="12" fill="#1F4E79" text-anchor="middle">PCIe switch A</text>
<rect x="590" y="196" width="200" height="34" rx="6" fill="#DAE3F3" stroke="#8FAADC"/><text x="690" y="218" font-size="12" fill="#1F4E79" text-anchor="middle">PCIe switch B</text>
<line x1="270" y1="152" x2="270" y2="196" stroke="#7F7F7F" stroke-width="3"/><text x="280" y="180" font-size="11" fill="#5F5E5A">上行（Gen5 x16）</text>
<line x1="690" y1="152" x2="690" y2="196" stroke="#7F7F7F" stroke-width="3"/><text x="700" y="180" font-size="11" fill="#5F5E5A">上行（Gen5 x16）</text>

<!-- GPUs -->
<rect x="140" y="288" width="120" height="56" rx="6" fill="#1F4E79"/><text x="200" y="312" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">GPU 0</text><text x="200" y="330" font-size="11" fill="#DAE3F3" text-anchor="middle">目標卡</text>
<rect x="280" y="288" width="120" height="56" rx="6" fill="#ffffff" stroke="#A6A6A6"/><text x="340" y="312" font-size="12.5" fill="#2C2C2A" text-anchor="middle">GPU 1</text><text x="340" y="330" font-size="11" fill="#5F5E5A" text-anchor="middle">在做 decode</text>
<rect x="560" y="288" width="120" height="56" rx="6" fill="#ffffff" stroke="#E07B24" stroke-width="2"/><text x="620" y="312" font-size="12.5" fill="#2C2C2A" text-anchor="middle">GPU 2</text><text x="620" y="330" font-size="11" fill="#5F5E5A" text-anchor="middle">在做 decode＋轉送</text>
<rect x="700" y="288" width="120" height="56" rx="6" fill="#ffffff" stroke="#A6A6A6"/><text x="760" y="312" font-size="12.5" fill="#2C2C2A" text-anchor="middle">GPU 3</text><text x="760" y="330" font-size="11" fill="#5F5E5A" text-anchor="middle">在做 decode</text>
<g stroke="#A6A6A6" stroke-width="2"><line x1="230" y1="230" x2="200" y2="288"/><line x1="310" y1="230" x2="340" y2="288"/><line x1="650" y1="230" x2="620" y2="288"/><line x1="730" y1="230" x2="760" y2="288"/></g>

<!-- NVLink -->
<rect x="140" y="400" width="680" height="30" rx="6" fill="#F7F7F5" stroke="#A6A6A6"/>
<text x="480" y="420" font-size="12" fill="#2C2C2A" text-anchor="middle">NVSwitch／NVLink（卡對卡；資料平行時幾乎沒在用）</text>
<g stroke="#A6A6A6" stroke-width="2"><line x1="200" y1="344" x2="200" y2="400"/><line x1="340" y1="344" x2="340" y2="400"/><line x1="620" y1="344" x2="620" y2="400"/><line x1="760" y1="344" x2="760" y2="400"/></g>

<!-- paths -->
<path d="M190,138 C190,170 230,180 232,198" fill="none" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#an)"/>
<path d="M226,230 L206,284" fill="none" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#an)"/>
<path d="M610,138 C610,170 650,180 652,198" fill="none" stroke="#E07B24" stroke-width="2.5" marker-end="url(#ao)"/>
<path d="M646,230 L626,284" fill="none" stroke="#E07B24" stroke-width="2.5" marker-end="url(#ao)"/>
<path d="M606,344 L606,392 L214,392 L214,350" fill="none" stroke="#E07B24" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#ao)"/>
<text x="410" y="376" font-size="11.5" fill="#E07B24" text-anchor="middle">片 2、3：GPU 2 收進暫存區，經 NVLink 推給 GPU 0（不佔 SM）</text>

<!-- notes -->
<text x="352" y="252" font-size="11" fill="#5F5E5A">GPU 1 和 GPU 0 共用 switch A</text>
<text x="352" y="268" font-size="11" fill="#5F5E5A">的上行 → 不算多一條路</text>

<rect x="40" y="452" width="430" height="92" rx="6" fill="#EEF3FA" stroke="#8FAADC"/>
<text x="56" y="474" font-size="12.5" font-weight="600" fill="#1F4E79">理想值（〔算術〕arith §3，14B・256K、48 GiB）</text>
<text x="56" y="496" font-size="12" fill="#2C2C2A">1 條上行 0.90 s → 2 條 0.45 s → 4 條 0.22 s</text>
<text x="56" y="516" font-size="11.5" fill="#5F5E5A">單卡 pinned H2D 實測 53.55 GiB/s；多卡同時、NVLink 都沒量</text>
<text x="56" y="534" font-size="11.5" fill="#5F5E5A">過關：k＝2 時端到端 ≥1.6 倍（G-M06）</text>
<rect x="490" y="452" width="430" height="92" rx="6" fill="#FBF3F2" stroke="#E6CFCB"/>
<text x="506" y="474" font-size="12.5" font-weight="600" fill="#C0504D">警告與前例（摘要級）</text>
<text x="506" y="496" font-size="12" fill="#2C2C2A">Beluga：跨 switch 的 P2P 只有寫 33、讀 23 GB/s（root complex）</text>
<text x="506" y="516" font-size="12" fill="#2C2C2A">DualPath：叢集層級「借 decode 端閒著的儲存網卡」已做</text>
<text x="506" y="534" font-size="12" fill="#2C2C2A">Harvest、SwiftCache：借鄰卡的 HBM 容量（不是頻寬）</text>
</svg>
