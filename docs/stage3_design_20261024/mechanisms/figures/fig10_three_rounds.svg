<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<defs>
<marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5F5E5A"/></marker>
</defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="480" y="30" font-size="18" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 10　「找一個 SOTA 改它」：我們的 SOTA 一直是 Cake，已經改了兩次</text>
<text x="480" y="52" font-size="12.5" fill="#5F5E5A" text-anchor="middle">前兩次改「寫入」（存的時候就決定），都沒用；第三次改「讀取」（回來的那一刻才決定）</text>

<!-- SOTA box -->
<rect x="330" y="72" width="300" height="58" rx="8" fill="#F7F7F5" stroke="#7F7F7F"/>
<text x="480" y="96" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">SOTA：Cake（ICML 2025）</text>
<text x="480" y="118" font-size="12" fill="#5F5E5A" text-anchor="middle">回來時：前段重算、後段從倉庫搬，兩邊碰頭</text>
<g stroke="#5F5E5A" stroke-width="1.4" fill="none" marker-end="url(#a1)">
<path d="M400,130 L170,170"/><path d="M480,130 L480,170"/><path d="M560,130 L790,170"/>
</g>

<!-- round 1 -->
<rect x="30" y="176" width="280" height="178" rx="8" fill="#ffffff" stroke="#A6A6A6"/>
<text x="46" y="200" font-size="13.5" font-weight="600" fill="#2C2C2A">第 1 次（第一階段）</text>
<text x="46" y="222" font-size="12" fill="#2C2C2A">改：<tspan font-weight="600">存的時候</tspan>就決定每段放哪一層</text>
<text x="46" y="242" font-size="11.5" fill="#5F5E5A">想法：前段反正會被重算 → 不存；</text>
<text x="46" y="258" font-size="11.5" fill="#5F5E5A">後段放快的層</text>
<line x1="46" y1="272" x2="294" y2="272" stroke="#E6CFCB"/>
<text x="46" y="292" font-size="12" font-weight="600" fill="#C0504D">結果：沒用</text>
<text x="46" y="312" font-size="11.5" fill="#2C2C2A">MI300X：36 組比較，0 組贏 5%</text>
<text x="46" y="330" font-size="11.5" fill="#2C2C2A">H200：和「滿了再搬」差 ±0.5% 內</text>

<!-- round 2 -->
<rect x="340" y="176" width="280" height="178" rx="8" fill="#ffffff" stroke="#A6A6A6"/>
<text x="356" y="200" font-size="13.5" font-weight="600" fill="#2C2C2A">第 2 次（第二階段）</text>
<text x="356" y="222" font-size="12" fill="#2C2C2A">改：<tspan font-weight="600">存的時候</tspan>就決定每段多清楚</text>
<text x="356" y="242" font-size="11.5" fill="#5F5E5A">想法：前段反正會被重算 → 存成</text>
<text x="356" y="258" font-size="11.5" fill="#5F5E5A">低精度也沒差</text>
<line x1="356" y1="272" x2="604" y2="272" stroke="#E6CFCB"/>
<text x="356" y="292" font-size="12" font-weight="600" fill="#C0504D">結果：沒用</text>
<text x="356" y="312" font-size="11.5" fill="#2C2C2A">前／中／後 25% 對隨機：都在 ±0.33 分</text>
<text x="356" y="330" font-size="11.5" fill="#2C2C2A">前段沒掉分，是因為根本沒被讀到</text>

<!-- round 3 -->
<rect x="650" y="176" width="280" height="178" rx="8" fill="#EEF3FA" stroke="#1F4E79" stroke-width="2"/>
<text x="666" y="200" font-size="13.5" font-weight="600" fill="#1F4E79">第 3 次（現在）</text>
<text x="666" y="222" font-size="12" fill="#2C2C2A">改：<tspan font-weight="600">回來的時候</tspan>才決定每段多清楚</text>
<text x="666" y="242" font-size="11.5" fill="#5F5E5A">想法：新問題來了才知道要哪幾頁；</text>
<text x="666" y="258" font-size="11.5" fill="#5F5E5A">GPU 上一直留一份縮印版</text>
<line x1="666" y1="272" x2="914" y2="272" stroke="#8FAADC"/>
<text x="666" y="292" font-size="12" font-weight="600" fill="#1F4E79">結果：還沒量（11/17 判定）</text>
<text x="666" y="312" font-size="11.5" fill="#2C2C2A">已量到的前提（O3，挑對的比例比隨機高）：</text>
<text x="666" y="330" font-size="11.5" fill="#2C2C2A">寫入時猜 +11～24；問題來了 +61～68 分</text>

<!-- bottom: why + where -->
<rect x="30" y="372" width="590" height="80" rx="8" fill="#FBF3F2" stroke="#E6CFCB"/>
<text x="46" y="396" font-size="12.5" font-weight="600" fill="#C0504D">前兩次為什麼沒用（同一個原因）</text>
<text x="46" y="418" font-size="12" fill="#2C2C2A">決定需要的資訊在「存的時候」還不存在：要哪幾頁，要等新問題來才知道</text>
<text x="46" y="438" font-size="12" fill="#2C2C2A">→ 這本身就是一篇「改 SOTA 沒用，以及為什麼」的論文：路 1（ICPE）</text>
<rect x="650" y="372" width="280" height="80" rx="8" fill="#EEF3FA" stroke="#8FAADC"/>
<text x="666" y="396" font-size="12.5" font-weight="600" fill="#1F4E79">第 3 次如果成立</text>
<text x="666" y="418" font-size="12" fill="#2C2C2A">就是「改 SOTA 有用」那一篇：路 2</text>
<text x="666" y="438" font-size="12" fill="#2C2C2A">沒成立：負面結果併進路 1</text>
</svg>
