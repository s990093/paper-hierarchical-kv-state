<rect x="40" y="436" width="280" height="84" rx="6" fill="#F7F7F5" stroke="#D9D9D6"/>
<text x="56" y="460" font-size="13" font-weight="600" fill="#2C2C2A">F3　重算貴在注意力</text>
<text x="56" y="482" font-size="12" fill="#2C2C2A">重算 ÷ CPU 層載入：32K 16 倍、128K 37 倍</text>
<text x="56" y="502" font-size="11" fill="#5F5E5A">〔算術，由 H200 實測的冷 prefill 擬合〕</text>
<rect x="340" y="436" width="280" height="84" rx="6" fill="#F7F7F5" stroke="#D9D9D6"/>
<text x="356" y="460" font-size="13" font-weight="600" fill="#2C2C2A">F4　decode 讓 tensor core 閒著</text>
<text x="356" y="482" font-size="12" fill="#2C2C2A">每步 2.6–4.0 FLOP／byte；吃滿要 189</text>
<text x="356" y="502" font-size="11" fill="#5F5E5A">〔算術，H200 實測 matmul 與 HBM〕</text>
<rect x="640" y="436" width="280" height="84" rx="6" fill="#F7F7F5" stroke="#D9D9D6"/>
<text x="656" y="460" font-size="13" font-weight="600" fill="#2C2C2A">F5　低位元的傷害隨長度變大</text>
<text x="656" y="482" font-size="12" fill="#2C2C2A">Qwen int2：32K −9.7 → 256K −14.4 分</text>
<text x="656" y="502" font-size="11" fill="#5F5E5A">〔實測，tables_longctx256 §2，n＝36〕</text>
</g>
