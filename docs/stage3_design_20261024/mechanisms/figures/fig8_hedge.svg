<rect x="680" y="198" width="150" height="26" fill="#1F4E79"/>
<text x="755" y="215" font-size="11.5" fill="#ffffff" text-anchor="middle">從前面開始重算（Cake）</text>
<line x1="830" y1="116" x2="830" y2="250" stroke="#1F4E79" stroke-width="1.5"/>
<text x="834" y="240" font-size="11" fill="#1F4E79">重算先到 → 用它</text>

<rect x="520" y="292" width="410" height="128" rx="6" fill="#F7F7F5" stroke="#D9D9D6"/>
<text x="534" y="314" font-size="12.5" font-weight="600" fill="#2C2C2A">為什麼現在的系統沒有這個</text>
<text x="534" y="336" font-size="12" fill="#2C2C2A">vLLM 的 connector 只能表達「載入已算部分之後</text>
<text x="534" y="354" font-size="12" fill="#2C2C2A">的連續前綴」（EVAL_FOUNDATIONS §10.2），</text>
<text x="534" y="372" font-size="12" fill="#2C2C2A">所以會乾等慢層。I3g 的 context 最長 24K：</text>
<text x="534" y="390" font-size="12" fill="#2C2C2A">vLLM 冷 prefill 32K 為 4.58 s（MI300X）、1.22 s（H200）</text>
<text x="534" y="410" font-size="11" fill="#5F5E5A">重算有上界，排隊沒有。新意低中（Cake＋Tail at Scale），影響大</text>
</svg>
