<text x="676" y="128" font-size="11" fill="#C0504D" text-anchor="end">排在別人的讀取後面</text>
<rect x="790" y="134" width="130" height="26" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="5,3"/>
<text x="855" y="151" font-size="11" fill="#7F7F7F" text-anchor="middle">剩下的讀取：取消</text>
<line x1="680" y1="116" x2="680" y2="250" stroke="#E07B24" stroke-width="1.5" stroke-dasharray="5,3"/>
