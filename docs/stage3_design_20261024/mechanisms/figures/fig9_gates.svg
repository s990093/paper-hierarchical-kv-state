<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<defs>
<marker id="ak" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5F5E5A"/></marker>
</defs>
<rect width="960" height="480" fill="#ffffff"/>
<text x="480" y="30" font-size="18" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 9　接下來三週：哪些閘、什麼時候；11/17 之後論文長什麼樣</text>
<text x="480" y="52" font-size="12.5" fill="#5F5E5A" text-anchor="middle">GPU 小時都是〔估計〕；05 的 A0／B0／C0／D0 照舊，這裡是新增的部分（06 §2）</text>

<!-- date axis: 10/24 -> x=60, 30 px/day -->
<line x1="60" y1="270" x2="800" y2="270" stroke="#7F7F7F"/>
<g font-size="11" fill="#5F5E5A" text-anchor="middle">
<line x1="60" y1="266" x2="60" y2="274" stroke="#7F7F7F"/><text x="60" y="288">10/24</text>
<line x1="330" y1="266" x2="330" y2="274" stroke="#7F7F7F"/><text x="330" y="288">11/2</text>
<line x1="540" y1="266" x2="540" y2="274" stroke="#7F7F7F"/><text x="540" y="288">11/9</text>
<line x1="750" y1="266" x2="750" y2="274" stroke="#7F7F7F"/><text x="750" y="288">11/16</text>
</g>

<!-- lanes -->
<text x="60" y="84" font-size="12" font-weight="600" fill="#2C2C2A">準備（ICPE 補量優先；只用 CPU 或空著的卡）</text>
<rect x="60" y="92" width="270" height="46" rx="5" fill="#F7F7F5" stroke="#A6A6A6"/>
<text x="72" y="111" font-size="11" fill="#2C2C2A">判準登記、G-fio、G-M13 模擬重播</text>
<text x="72" y="128" font-size="11" fill="#2C2C2A">14B no-DCA、長 context 背景產生器</text>

<text x="360" y="154" font-size="12" font-weight="600" fill="#2C2C2A">量時間（獨佔；G-M06 用 4 卡）約 15 GPU h</text>
<rect x="360" y="162" width="180" height="46" rx="5" fill="#DAE3F3" stroke="#8FAADC"/>
<text x="370" y="181" font-size="11" fill="#1F4E79">B0＋G-M08、G-M06</text>
<text x="370" y="198" font-size="11" fill="#1F4E79">G-M11、G-M12 速度</text>

<text x="570" y="84" font-size="12" font-weight="600" fill="#2C2C2A">量品質（可共用）約 30 GPU h</text>
<rect x="570" y="92" width="180" height="46" rx="5" fill="#1F4E79"/>
<text x="580" y="111" font-size="11" fill="#ffffff">A0＋G-M01/02（128K／256K）</text>
<text x="580" y="128" font-size="11" fill="#ffffff">G-M12 品質、G-M04、G-M03</text>

<!-- decision -->
<polygon points="790,200 830,230 790,260 750,230" fill="#FFF2CC" stroke="#E07B24"/>
<text x="790" y="226" font-size="11" fill="#2C2C2A" text-anchor="middle">11/17</text>
<text x="790" y="240" font-size="11" fill="#2C2C2A" text-anchor="middle">決定</text>
<text x="850" y="226" font-size="11" fill="#5F5E5A">給老師的</text>
<text x="850" y="240" font-size="11" fill="#5F5E5A">GO／STOP 報告</text>

<!-- outcomes -->
<g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#ak)">
<path d="M770,262 C600,300 300,300 190,328"/>
<path d="M790,262 L500,328"/>
<path d="M800,262 L800,328"/>
</g>
<rect x="40" y="332" width="300" height="128" rx="6" fill="#1F4E79"/>
<text x="54" y="356" font-size="13" font-weight="600" fill="#ffffff">P1（推薦）：A0 過＋G-M08 過</text>
<text x="54" y="378" font-size="11.5" fill="#ffffff">從 HBM 的縮圖直接開始，邊算邊補</text>
<text x="54" y="398" font-size="11.5" fill="#DAE3F3">核心 M01＋M02；M08（＋M12）讓計算免費</text>
<text x="54" y="418" font-size="11.5" fill="#DAE3F3">M09 當規劃器；M13 安全網；M06 過就加</text>
<text x="54" y="442" font-size="11" fill="#DAE3F3">HotOS 2/1 先占位置 → 完整版</text>
<rect x="360" y="332" width="280" height="128" rx="6" fill="#DAE3F3" stroke="#8FAADC"/>
<text x="374" y="356" font-size="13" font-weight="600" fill="#1F4E79">P2：A0 不過、M08／M06 過</text>
<text x="374" y="378" font-size="11.5" fill="#2C2C2A">借閒置資源的還原</text>
<text x="374" y="398" font-size="11.5" fill="#2C2C2A">M06＋M08＋M12＋M13</text>
<text x="374" y="418" font-size="11.5" fill="#2C2C2A">不靠挑塊，品質不變</text>
<rect x="660" y="332" width="270" height="128" rx="6" fill="#ffffff" stroke="#A6A6A6"/>
<text x="674" y="356" font-size="13" font-weight="600" fill="#2C2C2A">P3：A0 過、M08 不過</text>
<text x="674" y="378" font-size="11.5" fill="#2C2C2A">讀回邊界的查詢導向精修</text>
<text x="674" y="398" font-size="11.5" fill="#2C2C2A">M01＋M02＋M03（＋M04）</text>
<text x="674" y="418" font-size="11.5" fill="#5F5E5A">全部不過 → 負面結果併進路 1</text>
</svg>
