<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="470" fill="#ffffff"/>
<text x="480" y="30" font-size="18" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 2　三種還原：均勻壓縮、選擇性還原、漸進式還原（示意）</text>
<text x="480" y="52" font-size="12.5" fill="#5F5E5A" text-anchor="middle">每格一個 512-token 塊（畫 16 塊代表 64 塊）。橘框＝新問題的答案所在的塊，這裡故意畫成「沒被挑中」</text>

<!-- row 1: uniform -->
<text x="30" y="104" font-size="14.5" font-weight="600" fill="#2C2C2A">① 均勻壓縮</text>
<text x="30" y="124" font-size="11.5" fill="#5F5E5A">3a X4：每塊同樣倍數</text>
<g>
<rect x="250" y="92" width="36" height="34" fill="#8FAADC"/><rect x="290" y="92" width="36" height="34" fill="#8FAADC"/><rect x="330" y="92" width="36" height="34" fill="#8FAADC"/><rect x="370" y="92" width="36" height="34" fill="#8FAADC"/>
<rect x="410" y="92" width="36" height="34" fill="#8FAADC"/><rect x="450" y="92" width="36" height="34" fill="#8FAADC"/><rect x="490" y="92" width="36" height="34" fill="#8FAADC"/><rect x="530" y="92" width="36" height="34" fill="#8FAADC"/>
<rect x="570" y="92" width="36" height="34" fill="#8FAADC"/><rect x="610" y="92" width="36" height="34" fill="#8FAADC" stroke="#E07B24" stroke-width="3"/><rect x="650" y="92" width="36" height="34" fill="#8FAADC"/><rect x="690" y="92" width="36" height="34" fill="#8FAADC"/>
<rect x="730" y="92" width="36" height="34" fill="#8FAADC"/><rect x="770" y="92" width="36" height="34" fill="#8FAADC"/><rect x="810" y="92" width="36" height="34" fill="#8FAADC"/><rect x="850" y="92" width="36" height="34" fill="#8FAADC"/>
</g>
<text x="250" y="146" font-size="12" fill="#2C2C2A">倍數越高，每一塊都一起變糊：Qwen 8× −0.7、32× −7.8 個百分點（O5，實測）</text>

<!-- row 2: selective -->
<text x="30" y="204" font-size="14.5" font-weight="600" fill="#2C2C2A">② 選擇性還原</text>
<text x="30" y="224" font-size="11.5" fill="#5F5E5A">C1b：只載挑中的塊</text>
<g>
<rect x="250" y="192" width="36" height="34" fill="#1F4E79"/>
<rect x="290" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/><rect x="330" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/><rect x="370" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/>
<rect x="410" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/>
<rect x="450" y="192" width="36" height="34" fill="#1F4E79"/><rect x="490" y="192" width="36" height="34" fill="#1F4E79"/>
<rect x="530" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/><rect x="570" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/>
<rect x="610" y="192" width="36" height="34" fill="#ffffff" stroke="#E07B24" stroke-width="3" stroke-dasharray="5 3"/>
<rect x="650" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/>
<rect x="690" y="192" width="36" height="34" fill="#1F4E79"/>
<rect x="730" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/><rect x="770" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/><rect x="810" y="192" width="36" height="34" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/>
<rect x="850" y="192" width="36" height="34" fill="#1F4E79"/>
</g>
<text x="628" y="184" font-size="11.5" fill="#C0504D" text-anchor="middle" font-weight="600">漏選＝答錯</text>
<text x="250" y="246" font-size="12" fill="#2C2C2A">省最多，但漏一塊答案就錯：Quest 放回 1/2 掉 8–12 個百分點（O4，實測）</text>

<!-- row 3: progressive -->
<text x="30" y="304" font-size="14.5" font-weight="600" fill="#1F4E79">③ 漸進式還原（A）</text>
<text x="30" y="324" font-size="11.5" fill="#5F5E5A">全部讀粗版＋只升級少數塊</text>
<g>
<rect x="250" y="292" width="36" height="34" fill="#1F4E79"/>
<rect x="290" y="292" width="36" height="34" fill="#DAE3F3"/><rect x="330" y="292" width="36" height="34" fill="#DAE3F3"/><rect x="370" y="292" width="36" height="34" fill="#DAE3F3"/>
<rect x="410" y="292" width="36" height="34" fill="#DAE3F3"/>
<rect x="450" y="292" width="36" height="34" fill="#1F4E79"/><rect x="490" y="292" width="36" height="34" fill="#1F4E79"/>
<rect x="530" y="292" width="36" height="34" fill="#DAE3F3"/><rect x="570" y="292" width="36" height="34" fill="#DAE3F3"/>
<rect x="610" y="292" width="36" height="34" fill="#DAE3F3" stroke="#E07B24" stroke-width="3"/>
<rect x="650" y="292" width="36" height="34" fill="#DAE3F3"/>
<rect x="690" y="292" width="36" height="34" fill="#1F4E79"/>
<rect x="730" y="292" width="36" height="34" fill="#DAE3F3"/><rect x="770" y="292" width="36" height="34" fill="#DAE3F3"/><rect x="810" y="292" width="36" height="34" fill="#DAE3F3"/>
<rect x="850" y="292" width="36" height="34" fill="#1F4E79"/>
</g>
<text x="628" y="284" font-size="11.5" fill="#E07B24" text-anchor="middle" font-weight="600">漏選＝只是比較糊</text>
<text x="250" y="346" font-size="12" fill="#2C2C2A">用新問題在粗版上的 attention 挑要升級的塊；上界：完整 K 挑 1/4，Qwen +0.5（O4）</text>
<text x="250" y="364" font-size="12" fill="#C0504D">「全部粗＋少數細」在同位元組下比 ① 好多少：假設，A0 要驗</text>

<!-- legend -->
<rect x="250" y="400" width="22" height="16" fill="#1F4E79"/><text x="278" y="413" font-size="12" fill="#2C2C2A">清楚（INT4 或 BF16）</text>
<rect x="420" y="400" width="22" height="16" fill="#8FAADC"/><text x="448" y="413" font-size="12" fill="#2C2C2A">中等（均勻壓縮）</text>
<rect x="570" y="400" width="22" height="16" fill="#DAE3F3"/><text x="598" y="413" font-size="12" fill="#2C2C2A">粗版（例：32 倍）</text>
<rect x="720" y="400" width="22" height="16" fill="#ffffff" stroke="#A6A6A6" stroke-dasharray="4 3"/><text x="748" y="413" font-size="12" fill="#2C2C2A">沒有載入</text>
<text x="480" y="448" font-size="11.5" fill="#5F5E5A" text-anchor="middle">塊 0（sink 與任務說明）在 ② ③ 都一律清楚，位元組算進預算。實測數字見 02_observations.md 的 O4、O5</text>
</svg>
