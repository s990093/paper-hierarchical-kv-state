<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="500" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker></defs>
<text x="480" y="30" font-size="18" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 1　決定的時機，從寫入那一刻移到讀取那一刻</text>
<text x="480" y="52" font-size="12.5" fill="#5F5E5A" text-anchor="middle">左：8 月的原始設計。中：第一、二階段量到不需要的。右：第三階段要做的四個讀取時決定</text>

<!-- panel 1 -->
<rect x="24" y="72" width="280" height="390" rx="8" fill="#F7F7F5" stroke="#D9D9D6"/>
<text x="164" y="98" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">原本的 Tiara（8 月）</text>
<text x="164" y="122" font-size="12.5" fill="#2C2C2A" text-anchor="middle">寫入時，預測器替每一塊</text>
<text x="164" y="140" font-size="12.5" fill="#2C2C2A" text-anchor="middle">選一個狀態</text>
<rect x="44" y="158" width="116" height="34" rx="5" fill="#DAE3F3"/><text x="102" y="180" font-size="12.5" fill="#2C2C2A" text-anchor="middle">GPU-BF16</text>
<rect x="168" y="158" width="116" height="34" rx="5" fill="#DAE3F3"/><text x="226" y="180" font-size="12.5" fill="#2C2C2A" text-anchor="middle">GPU-FP8</text>
<rect x="44" y="200" width="116" height="34" rx="5" fill="#DAE3F3"/><text x="102" y="222" font-size="12.5" fill="#2C2C2A" text-anchor="middle">GPU-INT4</text>
<rect x="168" y="200" width="116" height="34" rx="5" fill="#E2EFDA"/><text x="226" y="222" font-size="12.5" fill="#2C2C2A" text-anchor="middle">CPU</text>
<rect x="44" y="242" width="116" height="34" rx="5" fill="#E2EFDA"/><text x="102" y="264" font-size="12.5" fill="#2C2C2A" text-anchor="middle">SSD</text>
<rect x="168" y="242" width="116" height="34" rx="5" fill="#FBE5D6"/><text x="226" y="264" font-size="12.5" fill="#2C2C2A" text-anchor="middle">丟掉再重算</text>
<text x="164" y="312" font-size="12" fill="#5F5E5A" text-anchor="middle">依據：位置、預測的重要性</text>
<text x="164" y="330" font-size="12" fill="#5F5E5A" text-anchor="middle">（寫入時就要知道）</text>
<text x="164" y="368" font-size="12" fill="#5F5E5A" text-anchor="middle">主張：κ 跨硬體變 32 倍</text>
<text x="164" y="386" font-size="12" fill="#5F5E5A" text-anchor="middle">→ 一種放法不能通吃</text>

<line x1="306" y1="267" x2="334" y2="267" stroke="#7F7F7F" stroke-width="2" marker-end="url(#ar)"/>

<!-- panel 2 -->
<rect x="340" y="72" width="280" height="390" rx="8" fill="#FBF3F2" stroke="#E6CFCB"/>
<text x="480" y="98" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">第一、二階段量到的</text>
<text x="356" y="134" font-size="13" font-weight="600" fill="#C0504D">✗ 寫入時依位置選層</text>
<text x="372" y="154" font-size="11.5" fill="#5F5E5A">36 組比較 0 組贏 5%（O1）</text>
<text x="356" y="190" font-size="13" font-weight="600" fill="#C0504D">✗ 寫入時依位置選精度</text>
<text x="372" y="210" font-size="11.5" fill="#5F5E5A">前、中、後對隨機 ±0.33 分（O2）</text>
<text x="356" y="246" font-size="13" font-weight="600" fill="#C0504D">✗ 寫入時猜哪些塊重要</text>
<text x="372" y="266" font-size="11.5" fill="#5F5E5A">只比隨機好 11–24 分；問題來了</text>
<text x="372" y="283" font-size="11.5" fill="#5F5E5A">才好 35–68 分（O3）</text>
<line x1="356" y1="306" x2="604" y2="306" stroke="#E6CFCB"/>
<text x="356" y="332" font-size="13" font-weight="600" fill="#2C2C2A">寫入端只剩：</text>
<text x="372" y="354" font-size="12" fill="#2C2C2A">先放 CPU、滿了再降級</text>
<text x="372" y="374" font-size="12" fill="#2C2C2A">降級時存成「可以分層讀」的格式</text>
<text x="372" y="404" font-size="11.5" fill="#5F5E5A">（決定需要的資訊，寫入時還不存在）</text>

<line x1="622" y1="267" x2="650" y2="267" stroke="#7F7F7F" stroke-width="2" marker-end="url(#ar)"/>

<!-- panel 3 -->
<rect x="656" y="72" width="280" height="390" rx="8" fill="#EEF3FA" stroke="#C9D6EA"/>
<text x="796" y="98" font-size="15" font-weight="600" fill="#1F4E79" text-anchor="middle">第三階段：讀取那一刻</text>
<text x="672" y="128" font-size="12.5" font-weight="600" fill="#2C2C2A">讀取時才有的資訊</text>
<rect x="672" y="138" width="120" height="26" rx="13" fill="#FFF2CC"/><text x="732" y="156" font-size="12" fill="#2C2C2A" text-anchor="middle">新問題</text>
<rect x="800" y="138" width="120" height="26" rx="13" fill="#FFF2CC"/><text x="860" y="156" font-size="12" fill="#2C2C2A" text-anchor="middle">GPU 誰在搶什麼</text>
<rect x="672" y="170" width="120" height="26" rx="13" fill="#FFF2CC"/><text x="732" y="188" font-size="12" fill="#2C2C2A" text-anchor="middle">下層頻寬</text>
<rect x="800" y="170" width="120" height="26" rx="13" fill="#FFF2CC"/><text x="860" y="188" font-size="12" fill="#2C2C2A" text-anchor="middle">context 長度</text>
<line x1="796" y1="204" x2="796" y2="226" stroke="#7F7F7F" stroke-width="2" marker-end="url(#ar)"/>
<text x="672" y="250" font-size="12.5" font-weight="600" fill="#2C2C2A">四個決定</text>
<rect x="672" y="260" width="248" height="34" rx="5" fill="#8FAADC"/><text x="684" y="282" font-size="12.5" fill="#2C2C2A">① 每塊讀多清楚（A，副線）</text>
<rect x="672" y="300" width="248" height="34" rx="5" fill="#8FAADC"/><text x="684" y="322" font-size="12.5" fill="#2C2C2A">② 重算／載入的切點（C）</text>
<rect x="672" y="340" width="248" height="34" rx="5" fill="#1F4E79"/><text x="684" y="362" font-size="12.5" fill="#ffffff">③ 解碼路徑與格式（B，主線）</text>
<rect x="672" y="380" width="248" height="34" rx="5" fill="#1F4E79"/><text x="684" y="402" font-size="12.5" fill="#ffffff">④ 給還原多少 SM、誰先（B，主線）</text>
<text x="796" y="442" font-size="11.5" fill="#5F5E5A" text-anchor="middle">κ 變成「現場的資源向量」</text>
<text x="480" y="488" font-size="11.5" fill="#5F5E5A" text-anchor="middle">O1–O3 的數字與出處見 02_observations.md</text>
</svg>
