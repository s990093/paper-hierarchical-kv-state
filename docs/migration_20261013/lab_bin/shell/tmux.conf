# MI300X Lab tmux — lives in /mlsteam/workspace/shell, linked to ~/.tmux.conf by 50_shell.sh
set -g default-shell /mlsteam/workspace/shell/zsh/bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g status-style "bg=#313244,fg=#cdd6f4"
set -g status-left "#[bold] #S "
set -g status-right " #H  %m/%d %H:%M "
