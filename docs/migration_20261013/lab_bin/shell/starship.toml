"$schema" = 'https://starship.rs/config-schema.json'

# Rainbow pill style (modeled on Powerlevel10k "rainbow"):
# ╭─░▒▓  ~/hello   main !? ─────────────  ✓  at 03:31:25 PM  ▓▒░─╮
# ╰─❯                                                                ─╯
# Previous plain style: ~/.config/starship.toml.bak-plain

palette = "rainbow"

format = """
[╭─](frame)[░▒▓](white)\
$os\
$hostname\
[](fg:white bg:blue)\
$directory\
${custom.dir_end}\
($git_branch$git_status$git_state[](fg:purple))\
$fill\
$cmd_duration\
$python\
$conda\
$status\
$time\
[─╮](frame)
[╰─](frame)$character"""

right_format = "[─╯](frame)"

add_newline = true
command_timeout = 800

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "fg:ink bg:white"

[os.symbols]
Macos = ""
Ubuntu = ""

# Remote copy: machine name (ssh only) so lab boxes are distinguishable.
[hostname]
ssh_only = true
ssh_symbol = ""
format = "[ $hostname ]($style)"
style = "fg:ink bg:white bold"

[directory]
format = "[  $path$read_only ]($style)"
style = "fg:white bg:blue"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

# Closes the blue pill when there is no git segment after it.
[custom.dir_end]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["sh"]
format = "[](fg:blue)"

[git_branch]
format = "[](fg:blue bg:purple)[ $symbol$branch ]($style)"
symbol = "  "
style = "fg:white bg:purple"

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "fg:yellow bg:purple"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\) ]($style)"
style = "fg:yellow bg:purple"

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
format = "[took $duration ](yellow)"

[python]
format = '[${symbol}(${version} )(\($virtualenv\) )](yellow)'
symbol = " "

[conda]
format = "[$symbol$environment ](green)"
symbol = "🅒 "
ignore_base = true

[status]
disabled = false
format = "[](fg:$style)[ $symbol ](fg:white bg:$style)"
success_symbol = "✓"
symbol = "✘ $status"
not_executable_symbol = "🚫 $status"
not_found_symbol = "? $status"
sigint_symbol = "⏹ INT"
signal_symbol = "⚡ $signal_name"
style = "purple"

[time]
disabled = false
time_format = "%I:%M:%S %p"
format = "[](fg:purple bg:white)[ at $time  ]($style)[▓▒░](white)"
style = "fg:ink bg:white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.rainbow]
frame  = "#6c7086"
white  = "#e4e4e4"
ink    = "#1e1e2e"
blue   = "#2f80ed"
purple = "#6c5ce7"
red    = "#e5484d"
yellow = "#f9e2af"
