<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 1　用 OS 的概念看 KV cache 管理：五個分支，加上 OS 沒有的「重算」</text>
  <rect x="330" y="46" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="480" y="74" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">KV cache 管理</text>
  <g stroke="#888780" stroke-width="1.3" fill="none">
    <path d="M480 90 L480 108 L95 108 L95 124"/><path d="M480 108 L287 108 L287 124"/><path d="M480 108 L480 124"/><path d="M480 108 L673 108 L673 124"/><path d="M480 108 L865 108 L865 124"/>
  </g>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="15" y="124" width="160" height="50" rx="7" fill="#F1EFE8" stroke="#888780"/><text x="95" y="146" fill="#2C2C2A">① 放置</text><text x="95" y="164" font-size="12" font-weight="400" fill="#444441">Placement：放哪一層</text>
    <rect x="207" y="124" width="160" height="50" rx="7" fill="#F1EFE8" stroke="#888780"/><text x="287" y="146" fill="#2C2C2A">② 替換</text><text x="287" y="164" font-size="12" font-weight="400" fill="#444441">Replacement：誰出去</text>
    <rect x="400" y="124" width="160" height="50" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="480" y="146" fill="#26215C">③ 寫入策略</text><text x="480" y="164" font-size="12" font-weight="400" fill="#3C3489">Write policy</text>
    <rect x="593" y="124" width="160" height="50" rx="7" fill="#F1EFE8" stroke="#888780"/><text x="673" y="146" fill="#2C2C2A">④ 資料搬移</text><text x="673" y="164" font-size="12" font-weight="400" fill="#444441">Data movement：何時搬</text>
    <rect x="785" y="124" width="160" height="50" rx="7" fill="#F1EFE8" stroke="#888780"/><text x="865" y="146" fill="#2C2C2A">⑤ 粒度</text><text x="865" y="164" font-size="12" font-weight="400" fill="#444441">Page／block size</text>
  </g>
  <g font-size="12" fill="#444441" text-anchor="middle">
    <text x="95" y="198">HBM／DRAM／SSD</text><text x="95" y="216">KVDrive：依重要度</text><text x="95" y="234">本研究：依位置</text>
    <text x="287" y="198">LRU、LFU、ARC、CLOCK</text><text x="287" y="216">成本感知：Pensieve</text><text x="287" y="234">學習式：LARU、LPC</text>
    <text x="673" y="198">預取 Prefetch</text><text x="673" y="216">需求分頁 Demand paging</text><text x="673" y="234">逐出 Eviction</text>
    <text x="865" y="198">vLLM block 16 token</text><text x="865" y="216">LMCache chunk 256</text><text x="865" y="234">Cake I/O chunk 128</text>
  </g>
  <g stroke="#534AB7" stroke-width="1.3" fill="none"><path d="M480 174 L480 250 L405 250 L405 262"/><path d="M480 250 L555 250 L555 262"/><path d="M480 250 L480 316"/></g>
  <g font-size="12.5" text-anchor="middle">
    <rect x="345" y="262" width="120" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="405" y="281" fill="#26215C" font-weight="600">寫穿 WT</text><text x="405" y="298" fill="#3C3489" font-size="11.5">LMCache、SGLang</text>
    <rect x="495" y="262" width="120" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="555" y="281" fill="#26215C" font-weight="600">延後寫 WB</text><text x="555" y="298" fill="#3C3489" font-size="11.5">Mooncake Store</text>
    <rect x="330" y="316" width="300" height="78" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="480" y="336" fill="#26215C" font-weight="600">寫入配置 vs 不配置（write-allocate）</text>
    <text x="480" y="354" fill="#3C3489" font-size="11.5">新 KV 要不要佔用快的層（CPU）？</text>
    <text x="480" y="371" fill="#3C3489" font-size="11.5">准入 admission：命中 2 次才寫（Strata）</text>
    <text x="480" y="388" fill="#3C3489" font-size="11.5">本研究 S5：後段配置在 CPU、前段直接寫 SSD</text>
  </g>
  <rect x="660" y="316" width="285" height="78" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.6"/>
  <text x="802" y="338" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle">KV 特有：⑥ 重算（recompute）</text>
  <text x="802" y="357" font-size="11.5" fill="#712B13" text-anchor="middle">OS 的頁面丟了就要從磁碟讀回</text>
  <text x="802" y="374" font-size="11.5" fill="#712B13" text-anchor="middle">KV 丟了可以用 token 重算出來</text>
  <text x="802" y="391" font-size="11.5" fill="#712B13" text-anchor="middle">Cake：重算＋搬運同時做</text>
  <rect x="15" y="416" width="930" height="60" rx="6" fill="#ffffff" stroke="#D3D1C7"/>
  <text x="30" y="438" font-size="12.5" fill="#2C2C2A"><tspan font-weight="600">這張圖和你的樹的差別：</tspan>(1) 寫入策略底下除了 WT／WB，還有「寫入配置」與「准入」；(2) 加上 KV 特有的第六個動作「重算」；</text>
  <text x="30" y="458" font-size="12.5" fill="#2C2C2A">(3) 紫色是本研究所在：寫入策略 × 放置。各系統的歸類依評測卡（`docs/write_path_20261008/02`）。</text>
  <text x="480" y="496" font-size="11" fill="#5F5E5A" text-anchor="middle">示意圖。OS 名詞依作業系統與計算機結構教科書的一般用法〔教科書〕；KV 對應是本文的整理〔判讀〕。</text>
</svg>
