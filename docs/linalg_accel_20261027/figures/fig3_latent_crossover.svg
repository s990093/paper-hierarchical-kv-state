<text x="480" y="52" font-size="12.5" fill="#5F5E5A" text-anchor="middle">Llama-3.1-8B・128K・A0 的 B24 縮圖（跨層每 4 層一組，K 秩 544、V 秩 832）。〔算術〕FLOPs，不含反量化（幾乎免費）</text><text x="480" y="72" font-size="12.5" fill="#C55A11" text-anchor="middle">橘線的 K 部分需要 RoPE 可交換基底：我們現在的基底做不到，前作是負面的（§2）</text>
