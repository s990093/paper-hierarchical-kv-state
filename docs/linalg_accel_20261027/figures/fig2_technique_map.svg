<svg xmlns="http://www.w3.org/2000/svg" width="1004" height="520" viewBox="0 0 1004 520" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<rect width="1004" height="520" fill="#ffffff"/>
<text x="502" y="30" font-size="18" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 2　線性代數與硬體技巧放在還原流程的哪裡、現在的狀態</text>
<text x="502" y="52" font-size="12.5" fill="#5F5E5A" text-anchor="middle">綠＝還空著、值得量；灰＝已在用或已被別人做掉；橘＝條件不成立、建議關掉。都是文獻＋〔算術〕，沒有新量測</text>
<rect x="20" y="70" width="186" height="32" rx="4" fill="#1F4E79"/><text x="113.0" y="91" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">① 暫停時（寫入）</text>
<rect x="20" y="112" width="186" height="64" rx="5" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.3"/>
<text x="113.0" y="138" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">跨層 SVD＋INT4 縮圖</text>
<text x="113.0" y="158" font-size="11.2" fill="#3A3A38" text-anchor="middle">已在 A0 用</text>
<rect x="20" y="186" width="186" height="64" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
<text x="113.0" y="212" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">快速 SVD：Gram＋TF32</text>
<text x="113.0" y="232" font-size="11.2" fill="#3A3A38" text-anchor="middle">寫入 0.89→0.04 s〔算術〕</text>
<rect x="20" y="260" width="186" height="64" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
<text x="113.0" y="286" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">存下區塊注意力圖</text>
<text x="113.0" y="306" font-size="11.2" fill="#3A3A38" text-anchor="middle">給重算當遮罩（沒找到前作）</text>
<rect x="20" y="334" width="186" height="64" rx="5" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.3"/>
<text x="113.0" y="360" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">隱藏狀態 latent</text>
<text x="113.0" y="380" font-size="11.2" fill="#3A3A38" text-anchor="middle">BellowsKV 10/26 已做</text>
<rect x="20" y="408" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="113.0" y="434" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">Hadamard 旋轉</text>
<text x="113.0" y="454" font-size="11.2" fill="#3A3A38" text-anchor="middle">和 SVD 逐分量尺度打架</text>
<path d="M207 86 l6 0" stroke="#1F4E79" stroke-width="2"/>
<rect x="214" y="70" width="186" height="32" rx="4" fill="#1F4E79"/><text x="307.0" y="91" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">② 存放與搬運</text>
<rect x="214" y="112" width="186" height="64" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
<text x="307.0" y="138" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">GPU 端無損解壓</text>
<text x="307.0" y="158" font-size="11.2" fill="#3A3A38" text-anchor="middle">唯一可能翻掉舊判定</text>
<rect x="214" y="186" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="307.0" y="212" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">存 hidden state（HCache）</text>
<text x="307.0" y="232" font-size="11.2" fill="#3A3A38" text-anchor="middle">GQA 下多搬 2–3.5 倍</text>
<rect x="214" y="260" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="307.0" y="286" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">CPU 上算注意力</text>
<text x="307.0" y="306" font-size="11.2" fill="#3A3A38" text-anchor="middle">AMX 也只到 23–33 token</text>
<rect x="214" y="334" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="307.0" y="360" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">2:4 稀疏</text>
<text x="307.0" y="380" font-size="11.2" fill="#3A3A38" text-anchor="middle">壓 K 掉 11 分</text>
<path d="M401 86 l6 0" stroke="#1F4E79" stroke-width="2"/>
<rect x="408" y="70" width="186" height="32" rx="4" fill="#1F4E79"/><text x="501.0" y="91" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">③ 回來：挑塊</text>
<rect x="408" y="112" width="186" height="64" rx="5" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.3"/>
<text x="501.0" y="138" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">縮圖＋逐層挑</text>
<text x="501.0" y="158" font-size="11.2" fill="#3A3A38" text-anchor="middle">主法；A0＝WEAK，等 A0-C</text>
<rect x="408" y="186" width="186" height="64" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
<text x="501.0" y="212" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">沒挑到的用群中心補</text>
<text x="501.0" y="232" font-size="11.2" fill="#3A3A38" text-anchor="middle">Multipole Attention 的想法</text>
<rect x="408" y="260" width="186" height="64" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
<text x="501.0" y="286" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">殘差精修</text>
<text x="501.0" y="306" font-size="11.2" fill="#3A3A38" text-anchor="middle">只送「原版－縮圖」</text>
<rect x="408" y="334" width="186" height="64" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
<text x="501.0" y="360" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">FP8 算挑塊 prefill</text>
<text x="501.0" y="380" font-size="11.2" fill="#3A3A38" text-anchor="middle">約 1.6 倍（FA3 實測）</text>
<path d="M595 86 l6 0" stroke="#1F4E79" stroke-width="2"/>
<rect x="602" y="70" width="186" height="32" rx="4" fill="#1F4E79"/><text x="695.0" y="91" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">④ 回來：重算</text>
<rect x="602" y="112" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="695.0" y="138" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">對角化／線性化 softmax</text>
<text x="695.0" y="158" font-size="11.2" fill="#3A3A38" text-anchor="middle">不訓練就崩；有理論下界</text>
<rect x="602" y="186" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="695.0" y="212" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">H-matrix、FMM、Strassen</text>
<text x="695.0" y="232" font-size="11.2" fill="#3A3A38" text-anchor="middle">要訓練或 GPU 上只 1.1 倍</text>
<rect x="602" y="260" width="186" height="64" rx="5" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.3"/>
<text x="695.0" y="286" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">稀疏重算（M12）</text>
<text x="695.0" y="306" font-size="11.2" fill="#3A3A38" text-anchor="middle">SparseX 最近</text>
<rect x="602" y="334" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="695.0" y="360" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">注意力免費也只快 ≤4 倍</text>
<text x="695.0" y="380" font-size="11.2" fill="#3A3A38" text-anchor="middle">見圖 1</text>
<path d="M789 86 l6 0" stroke="#1F4E79" stroke-width="2"/>
<rect x="796" y="70" width="186" height="32" rx="4" fill="#1F4E79"/><text x="889.0" y="91" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">⑤ 模型本身</text>
<rect x="796" y="112" width="186" height="64" rx="5" fill="#E2EFDA" stroke="#548235" stroke-width="1.3"/>
<text x="889.0" y="138" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">混合架構（3:1）</text>
<text x="889.0" y="158" font-size="11.2" fill="#3A3A38" text-anchor="middle">KV 小 5–20 倍 → 天平往搬偏</text>
<rect x="796" y="186" width="186" height="64" rx="5" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.3"/>
<text x="889.0" y="212" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">SSM 狀態卸載</text>
<text x="889.0" y="232" font-size="11.2" fill="#3A3A38" text-anchor="middle">vLLM、SGLang 已出貨</text>
<rect x="796" y="260" width="186" height="64" rx="5" fill="#FBE5D6" stroke="#C55A11" stroke-width="1.3"/>
<text x="889.0" y="286" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">Young／Daly 檢查點間隔</text>
<text x="889.0" y="306" font-size="11.2" fill="#3A3A38" text-anchor="middle">回來點已知，不適用</text>
<rect x="796" y="334" width="186" height="64" rx="5" fill="#EDEDED" stroke="#7F7F7F" stroke-width="1.3"/>
<text x="889.0" y="360" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">純 GQA 模型</text>
<text x="889.0" y="380" font-size="11.2" fill="#3A3A38" text-anchor="middle">審稿人會看成上一代</text>
<text x="20" y="508" font-size="12" fill="#5F5E5A">出處：① LE §2.3、LC §4、LD §2；② LF §4、LC §1、LC §3、LF §1；③ LE §2.2、本頁 §3、LF §4；④ LA §3、LE §1；⑤ LB §0、LD §0</text>
