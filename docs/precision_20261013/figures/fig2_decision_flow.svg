<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
<rect width="1100" height="800" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6"/></marker></defs>
<text x="550.0" y="30" font-size="18" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 2　這週的決策流程（判準與階梯開跑前寫死）</text>
<rect x="40" y="55" width="320" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="200.0" y="77" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Step 0　準備（D0–D1）</text>
<text x="200.0" y="97" font-size="12" fill="#5F5E5A" text-anchor="middle">正確性、f(i)、雜訊、codec、題目難度</text>
<text x="200.0" y="114" font-size="12" fill="#5F5E5A" text-anchor="middle">→ commit 凍結的事先登記</text>
<polyline points="200,135 200,158" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="158" width="320" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="200.0" y="180" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Step 1　第 1 階 FP8 的端點（D2）</text>
<text x="200.0" y="200" font-size="12" fill="#5F5E5A" text-anchor="middle">Llama、Qwen 各跑 E0、E1、E1s、E1sr</text>
<polyline points="200,222 200,245" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="200,245.0 350.0,302 200,359.0 50.0,302" fill="#FFF6E5" stroke="#BA7517" stroke-width="1.5"/>
<text x="200" y="290" font-size="12.5" fill="#2C2C2A" text-anchor="middle">均勻 FP8 就夠？</text>
<text x="200" y="306" font-size="12.5" fill="#2C2C2A" text-anchor="middle">（K1／K1s；不過先做</text>
<text x="200" y="322" font-size="12.5" fill="#2C2C2A" text-anchor="middle">Step 2b 換 codec → K3）</text>
<polyline points="350,302 400,302" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="360" y="294" font-size="12.5" font-weight="600" fill="#2C2C2A">是</text>
<rect x="400" y="270" width="320" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="560.0" y="292" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Step 1′　第 2 階 INT4 的端點（D3）</text>
<text x="560.0" y="312" font-size="12" fill="#5F5E5A" text-anchor="middle">FP8 這一階不需要位置 → 往下一階</text>
<polyline points="560,334 560,362" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="560,367.0 710.0,412 560,457.0 410.0,412" fill="#FFF6E5" stroke="#BA7517" stroke-width="1.5"/>
<text x="560" y="408" font-size="12.5" fill="#2C2C2A" text-anchor="middle">均勻 INT4 就夠？</text>
<text x="560" y="424" font-size="12.5" fill="#2C2C2A" text-anchor="middle">（K1／K1s）</text>
<polyline points="710,412 760,412" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="720" y="404" font-size="12.5" font-weight="600" fill="#2C2C2A">是</text>
<rect x="760" y="380" width="300" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="910.0" y="402" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">停：兩階都不需要位置策略</text>
<text x="910.0" y="422" font-size="12" fill="#5F5E5A" text-anchor="middle">→ 故事 A</text>
<text x="910" y="470" font-size="12" fill="#5F5E5A" text-anchor="middle">階梯只有 FP8 → INT4 兩階，事先寫死</text>
<text x="910" y="487" font-size="12" fill="#5F5E5A" text-anchor="middle">2-bit 這週不做</text>
<polyline points="560,457 560,535 362,535" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="568" y="490" font-size="12.5" font-weight="600" fill="#2C2C2A">否</text>
<polyline points="200,359 200,495" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="208" y="385" font-size="12.5" font-weight="600" fill="#2C2C2A">否</text>
<rect x="40" y="495" width="320" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="200.0" y="517" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Step 2　在「均勻不夠」的那一階（D3–D5）</text>
<text x="200.0" y="537" font-size="12" fill="#5F5E5A" text-anchor="middle">主模型照 §1.1 的表選</text>
<text x="200.0" y="554" font-size="12" fill="#5F5E5A" text-anchor="middle">F25／M25／B25／R25；讀法 A＋B；第 2 輪</text>
<polyline points="200,575 200,600" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="200,603.0 350.0,648 200,693.0 50.0,648" fill="#FFF6E5" stroke="#BA7517" stroke-width="1.5"/>
<text x="200" y="644" font-size="12.5" fill="#2C2C2A" text-anchor="middle">位置 vs 隨機：</text>
<text x="200" y="660" font-size="12.5" fill="#2C2C2A" text-anchor="middle">穩定差距（三條）？</text>
<polyline points="350,648 400,648" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="360" y="640" font-size="12.5" font-weight="600" fill="#2C2C2A">否</text>
<rect x="400" y="616" width="320" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="560.0" y="638" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">停 K2：位置沒有多幫</text>
<text x="560.0" y="658" font-size="12" fill="#5F5E5A" text-anchor="middle">只剩「比例」這個旋鈕 → 故事 A</text>
<polyline points="200,693 200,718" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="208" y="710" font-size="12.5" font-weight="600" fill="#2C2C2A">是</text>
<rect x="40" y="718" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="200.0" y="740" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Step 3　強規則 S25 對照</text>
<text x="200.0" y="760" font-size="12" fill="#5F5E5A" text-anchor="middle">→ 故事 B 或 C</text>
</svg>