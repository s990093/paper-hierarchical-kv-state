<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6"/></marker></defs>
  <text x="480" y="28" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">核心問題的結構：一個問題、三個子問題，其他都是工具</text>
  <rect x="150" y="46" width="660" height="78" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="480" y="74" font-size="16" font-weight="700" fill="#26215C" text-anchor="middle">核心問題</text>
  <text x="480" y="96" font-size="13" fill="#3C3489" text-anchor="middle">寫入時就依「每段回來時會怎麼被用」決定放哪一層，</text>
  <text x="480" y="114" font-size="13" fill="#3C3489" text-anchor="middle">能不能比「等空間不夠才搬」讓使用者等得更少？什麼條件下能、什麼條件下不能？</text>
  <g stroke="#5F5E5A" stroke-width="1.4" fill="none"><path d="M480 124 L480 140 L170 140 L170 154" marker-end="url(#a)"/><path d="M480 140 L480 154" marker-end="url(#a)"/><path d="M480 140 L790 140 L790 154" marker-end="url(#a)"/></g>
  <g text-anchor="middle">
    <rect x="40" y="158" width="260" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="170" y="184" font-size="14" font-weight="600" fill="#04342C">Q1 多寫的 I/O 會不會讓人等？</text><text x="170" y="206" font-size="12" fill="#085041">前段一定寫進 SSD，但多半用不到</text><text x="170" y="224" font-size="12" fill="#085041">實驗 A1、A2</text>
    <rect x="350" y="158" width="260" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="480" y="184" font-size="14" font-weight="600" fill="#04342C">Q2 GPU 忙時會不會變慢？</text><text x="480" y="206" font-size="12" fill="#085041">前段有備份，應該不會（要量）</text><text x="480" y="224" font-size="12" fill="#085041">實驗 A1（GPU 忙）</text>
    <rect x="660" y="158" width="260" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="790" y="184" font-size="14" font-weight="600" fill="#04342C">Q3 一開始放好 vs 等滿了再搬</text><text x="790" y="206" font-size="12" fill="#085041">S5 vs S4+（延後寫入＋成本感知）</text><text x="790" y="224" font-size="12" fill="#085041">實驗 B（最關鍵）</text>
  </g>
  <line x1="480" y1="236" x2="480" y2="262" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="150" y="266" width="660" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="480" y="290" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">判讀：S5 比最好的簡單策略好多少？</text>
  <text x="480" y="310" font-size="12.5" fill="#444441" text-anchor="middle">&lt; 5% 追平（調整核心）・5–15% 找老師・&gt; 15% 進第二階段（精度）</text>
  <text x="40" y="358" font-size="13.5" font-weight="600" fill="#2C2C2A">工具（用來回答問題，不是新的問題）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="370" width="210" height="88" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-dasharray="5 4"/><text x="145" y="394" font-weight="600" fill="#2C2C2A">OS 概念</text><text x="145" y="414" fill="#444441">替對手命名：寫穿、延後寫、</text><text x="145" y="430" fill="#444441">寫入配置、准入、成本感知</text><text x="145" y="446" fill="#5F5E5A">os_mapping/01–02</text>
    <rect x="265" y="370" width="210" height="88" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-dasharray="5 4"/><text x="370" y="394" font-weight="600" fill="#2C2C2A">論文地圖</text><text x="370" y="414" fill="#444441">為什麼這是空白、</text><text x="370" y="430" fill="#444441">和前例的界線</text><text x="370" y="446" fill="#5F5E5A">os_mapping/03、write_path/</text>
    <rect x="490" y="370" width="210" height="88" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-dasharray="5 4"/><text x="595" y="394" font-weight="600" fill="#2C2C2A">實驗設計</text><text x="595" y="414" fill="#444441">9 個策略、C／A0／A／B、</text><text x="595" y="430" fill="#444441">判準、時程</text><text x="595" y="446" fill="#5F5E5A">phase1_20261008/</text>
    <rect x="715" y="370" width="205" height="88" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-dasharray="5 4"/><text x="817" y="394" font-weight="600" fill="#2C2C2A">評測方法</text><text x="817" y="414" fill="#444441">怎麼比才公平、</text><text x="817" y="430" fill="#444441">統計、陷阱</text><text x="817" y="446" fill="#5F5E5A">EVAL_FOUNDATIONS</text>
  </g>
  <text x="480" y="500" font-size="11.5" fill="#5F5E5A" text-anchor="middle">讀法：先看紫色的核心和三個綠色子問題；虛線框只在需要時才翻。</text>
</svg>
