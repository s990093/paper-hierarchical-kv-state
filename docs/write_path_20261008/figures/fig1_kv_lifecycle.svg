<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6"/></marker></defs>
  <text x="450" y="28" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 1　KV 的一生：寫入問題在哪裡</text>
  <rect x="30" y="60" width="170" height="90" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="115" y="96" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">① 產生 KV</text>
  <text x="115" y="120" font-size="12.5" fill="#444441" text-anchor="middle">prefill／decode 算出來</text>
  <rect x="240" y="50" width="220" height="110" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
  <text x="350" y="78" font-size="15" font-weight="600" fill="#26215C" text-anchor="middle">② 寫入（四個決定）</text>
  <text x="350" y="99" font-size="12.5" fill="#3C3489" text-anchor="middle">要不要存（准入）</text>
  <text x="350" y="115" font-size="12.5" fill="#3C3489" text-anchor="middle">存到哪（放置）</text>
  <text x="350" y="131" font-size="12.5" fill="#3C3489" text-anchor="middle">什麼時候寫（時機）</text>
  <text x="350" y="147" font-size="12.5" fill="#3C3489" text-anchor="middle">怎麼寫（路徑）</text>
  <rect x="500" y="60" width="170" height="90" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="585" y="96" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">③ 存放與逐出</text>
  <text x="585" y="120" font-size="12.5" fill="#444441" text-anchor="middle">CPU、SSD 容量有限</text>
  <rect x="710" y="60" width="170" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="795" y="96" font-size="15" font-weight="600" fill="#04342C" text-anchor="middle">④ 讀取還原</text>
  <text x="795" y="120" font-size="12.5" fill="#085041" text-anchor="middle">使用者回來：算＋搬</text>
  <line x1="200" y1="105" x2="236" y2="105" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="460" y1="105" x2="496" y2="105" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="670" y1="105" x2="706" y2="105" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M240 180 L240 190 L460 190 L460 180" fill="none" stroke="#534AB7" stroke-width="1.4"/>
  <text x="350" y="212" font-size="12.5" fill="#3C3489" text-anchor="middle">現有系統：幾乎都是「全部寫」</text>
  <text x="350" y="231" font-size="12.5" fill="#3C3489" text-anchor="middle">（LMCache、Mooncake、CachedAttention…）</text>
  <text x="350" y="255" font-size="12.5" font-weight="600" fill="#26215C" text-anchor="middle">本研究：寫入時依位置決定每段的狀態</text>
  <path d="M500 180 L500 190 L670 190 L670 180" fill="none" stroke="#888780" stroke-width="1.4"/>
  <text x="585" y="212" font-size="12.5" fill="#444441" text-anchor="middle">逐出策略研究</text>
  <text x="585" y="231" font-size="12.5" fill="#444441" text-anchor="middle">（Pensieve、Fancy-eviction…）</text>
  <path d="M710 180 L710 190 L880 190 L880 180" fill="none" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="795" y="212" font-size="12.5" fill="#085041" text-anchor="middle">Cake、CacheFlow 只研究這一段</text>
  <text x="795" y="231" font-size="12.5" fill="#085041" text-anchor="middle">（Cake 假設 KV 早就全部存好）</text>
  <text x="450" y="288" font-size="11.5" fill="#5F5E5A" text-anchor="middle">示意圖。系統歸類依 docs/research_20261006_eval/cards 的評測卡（E03、E04、E05）。</text>
</svg>
