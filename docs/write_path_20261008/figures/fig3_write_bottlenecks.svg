<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
  <text x="450" y="28" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 3　寫入可能讓人多等的五個地方</text>
  <rect x="40" y="70" width="170" height="110" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="125" y="105" font-size="15" font-weight="600" fill="#26215C" text-anchor="middle">GPU</text>
  <text x="125" y="128" font-size="12" fill="#3C3489" text-anchor="middle">算 KV、重算、解碼</text>
  <rect x="360" y="70" width="170" height="110" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="445" y="105" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle">CPU 記憶體</text>
  <text x="445" y="128" font-size="12" fill="#444441" text-anchor="middle">pinned buffer</text>
  <rect x="680" y="70" width="170" height="110" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="765" y="105" font-size="15" font-weight="600" fill="#04342C" text-anchor="middle">SSD</text>
  <text x="765" y="128" font-size="12" fill="#085041" text-anchor="middle">檔案系統＋裝置</text>
  <line x1="210" y1="105" x2="356" y2="105" stroke="#993C1D" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="283" y="98" font-size="12" fill="#712B13" text-anchor="middle">寫入 D2H</text>
  <line x1="360" y1="150" x2="214" y2="150" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="283" y="168" font-size="12" fill="#085041" text-anchor="middle">載入 H2D</text>
  <text x="283" y="128" font-size="12" fill="#5F5E5A" text-anchor="middle">PCIe</text>
  <line x1="530" y1="105" x2="676" y2="105" stroke="#993C1D" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="603" y="98" font-size="12" fill="#712B13" text-anchor="middle">寫入</text>
  <line x1="680" y1="150" x2="534" y2="150" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="603" y="168" font-size="12" fill="#085041" text-anchor="middle">讀取</text>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="765" cy="58" r="12" fill="#993C1D"/><text x="765" y="63">1</text>
    <circle cx="840" cy="58" r="12" fill="#993C1D"/><text x="840" y="63">2</text>
    <circle cx="283" cy="128" r="0" fill="none"/>
    <circle cx="330" cy="128" r="12" fill="#993C1D"/><text x="330" y="133">3</text>
    <circle cx="60" cy="58" r="12" fill="#993C1D"/><text x="60" y="63">4</text>
    <circle cx="190" cy="58" r="12" fill="#993C1D"/><text x="190" y="63">5</text>
  </g>
  <g font-size="13" fill="#2C2C2A">
    <text x="40" y="225"><tspan font-weight="700" fill="#993C1D">1 寫入頻寬跟不上</tspan>：KV 產生得比 SSD 寫得快。3090 的 RUNLOG：toolagent 所有請求的 block 都寫，</text>
    <text x="40" y="243">　 需要 7,172 MiB/s（只寫不重複的也要約 3,086），但 QLC 的持續寫入只有 181 MiB/s</text>
    <text x="40" y="276"><tspan font-weight="700" fill="#993C1D">2 讀寫搶同一顆 SSD</tspan>：Tutti 量到讀寫並行時，總頻寬掉 60%（Fig. 6）</text>
    <text x="40" y="306"><tspan font-weight="700" fill="#993C1D">3 PCIe 雙向同時傳</tspan>：Pensieve 量到 GPU↔CPU 兩個方向同時傳，各自掉 18–20%</text>
    <text x="40" y="336"><tspan font-weight="700" fill="#993C1D">4 同步寫入卡在關鍵路徑</tspan>：CachedAttention 的消融，改成非同步保存，整體執行時間降 13–15%</text>
    <text x="40" y="366"><tspan font-weight="700" fill="#993C1D">5 搬運搶 GPU 資源</tspan>：Strata 的 I/O kernel 讓 prefill 慢不到 5%、decode 慢 10%（Fig. 5）</text>
  </g>
  <text x="40" y="404" font-size="11.5" fill="#5F5E5A">數字出處見 03_bottlenecks_and_gaps.md 的表格（評測卡 E03、E04 與 RUNLOG，commit 9deda4f）。示意圖，硬體路徑依平台而異。</text>
</svg>
