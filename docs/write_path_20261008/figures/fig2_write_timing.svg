<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <rect width="900" height="370" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">圖 2　寫入時機：三種常見做法與本研究，什麼時候把 KV 寫進 SSD</text>
  <g font-size="12.5" fill="#444441" text-anchor="middle">
    <text x="330" y="62">一輪結束</text><text x="330" y="78">（KV 剛產生）</text>
    <text x="520" y="62">使用者離開中</text>
    <text x="690" y="62">CPU 快滿了</text><text x="690" y="78">（要逐出）</text>
    <text x="840" y="62">使用者回來</text>
  </g>
  <g stroke="#B4B2A9" stroke-dasharray="3 4"><line x1="330" y1="86" x2="330" y2="330"/><line x1="690" y1="86" x2="690" y2="330"/><line x1="840" y1="86" x2="840" y2="330"/></g>
  <g font-size="13.5" font-weight="600" fill="#2C2C2A">
    <text x="24" y="120">寫穿 write-through</text>
    <text x="24" y="180">延後寫 write-back</text>
    <text x="24" y="240">選擇性 selective</text>
    <text x="24" y="300" fill="#26215C">本研究 S5</text>
  </g>
  <g font-size="11.5" fill="#5F5E5A">
    <text x="24" y="137">LMCache、SGLang 上游預設</text>
    <text x="24" y="197">Mooncake Store、HiCache 選項</text>
    <text x="24" y="257">Strata 預設、store_threshold</text>
    <text x="24" y="317">寫入時依位置決定狀態</text>
  </g>
  <g stroke="#D3D1C7" stroke-width="1"><line x1="250" y1="125" x2="880" y2="125"/><line x1="250" y1="185" x2="880" y2="185"/><line x1="250" y1="245" x2="880" y2="245"/><line x1="250" y1="305" x2="880" y2="305"/></g>
  <rect x="300" y="110" width="60" height="30" rx="5" fill="#FAECE7" stroke="#993C1D"/><text x="330" y="130" font-size="12" fill="#712B13" text-anchor="middle">全部寫</text>
  <rect x="650" y="170" width="80" height="30" rx="5" fill="#FAECE7" stroke="#993C1D"/><text x="690" y="190" font-size="12" fill="#712B13" text-anchor="middle">這時才寫</text>
  <text x="330" y="190" font-size="12" fill="#5F5E5A" text-anchor="middle">只放 CPU</text>
  <text x="330" y="250" font-size="12" fill="#5F5E5A" text-anchor="middle">只放 CPU</text>
  <rect x="786" y="230" width="108" height="30" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="4 3"/><text x="840" y="250" font-size="12" fill="#712B13" text-anchor="middle">第 2 次命中才寫</text>
  <rect x="290" y="290" width="80" height="30" rx="5" fill="#FAECE7" stroke="#993C1D"/><text x="330" y="310" font-size="12" fill="#712B13" text-anchor="middle">只寫前段</text>
  <text x="520" y="310" font-size="12" fill="#3C3489" text-anchor="middle">後段放 CPU</text>
  <text x="840" y="130" font-size="11.5" fill="#085041" text-anchor="middle">SSD 一定有</text>
  <text x="840" y="190" font-size="11.5" fill="#085041" text-anchor="middle">沒滿就在 CPU</text>
  <text x="840" y="276" font-size="11.5" fill="#085041" text-anchor="middle">冷的可能沒存</text>
  <text x="840" y="310" font-size="11.5" fill="#085041" text-anchor="middle">前 SSD、後 CPU</text>
  <rect x="250" y="340" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="270" y="352" font-size="11.5" fill="#444441">寫進 SSD 的時間點</text>
  <text x="430" y="352" font-size="11.5" fill="#5F5E5A">示意圖。系統對應依 EVAL_FOUNDATIONS §2.4 與 E04 卡。</text>
</svg>
